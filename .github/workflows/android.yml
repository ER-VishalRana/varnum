name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as the "apk-latest" release that the website serves

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runner already has the Android SDK (ANDROID_HOME is set).
      - name: Install packages
        run: npm ci

      - name: Copy the website into the app (web/ to www/)
        run: node scripts/sync-www.mjs

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build test APK (install directly on a phone)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: varnum-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # The website (varnum.alvvintechnology.com/download/varnum.apk) copies the APK from this release when it is published.
      - name: Publish the APK for the website
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk varnum.apk
          echo "{\"version\":\"$VERSION_NAME\",\"versionCode\":$VERSION_CODE,\"commit\":\"${GITHUB_SHA::7}\",\"built\":\"$(date -u +%Y-%m-%dT%H:%MZ)\"}" > version.json
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Varnum Android app (latest)" --notes "The APK served at https://varnum.alvvintechnology.com/download/varnum.apk" --latest
          gh release upload apk-latest varnum.apk version.json --clobber

      # Play Store bundle: runs only after the signing secrets are added (see README).
      - name: Build signed Play Store bundle
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: varnum-play-store-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
